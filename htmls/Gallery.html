<div class="gl-site" id="gl-site" data-page="Gallery">
<a class="gl-skip" href="#gl-main">Skip to content</a>
<header class="gl-head" id="gl-head">
    <div class="gl-head-row">
        <button type="button" class="gl-burger" aria-label="Open menu" onclick="GalleryJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a class="gl-logo" href="Home" aria-label="Home"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#231A17"/><path d="M14 31c-1-7 13-7 13-14 0-4-3-7-7.5-7" fill="none" stroke="#E8C9A9" stroke-width="3.2" stroke-linecap="round"/><path d="M20 32c0-5 9-5.5 9.5-11" fill="none" stroke="#C2553A" stroke-width="2.6" stroke-linecap="round"/></svg><span id="gl-brandname">{plhd_brand}</span></a>
        <nav class="gl-nav" id="gl-nav" aria-label="Main">
            <div class="gl-nav-top"><b>Menu</b><button type="button" class="gl-ibtn" aria-label="Close menu" onclick="GalleryJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="gl-menu"><li><a class="gl-ml" href="Home">Home</a></li><li><a class="gl-ml" href="Services">Services &amp; prices</a></li><li><a class="gl-ml" href="Stylists">Stylists</a></li><li><a class="gl-ml gl-on" href="Gallery" aria-current="page">Gallery</a></li><li><a class="gl-ml" href="Book">Book online</a></li><li><a class="gl-ml" href="Contact">Contact</a></li></ul>
        </nav>
        <a class="gl-btn gl-headbook" href="Book">Book now</a>
    </div>
    <div class="gl-scrim" id="gl-scrim" onclick="GalleryJs.closeNav()"></div>
</header>
<main class="gl-main" id="gl-main">{plhd_blocks}</main>
<footer class="gl-foot">{plhd_foot}</footer>
<div class="gl-lb" id="gl-lb" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" class="gl-lbx" aria-label="Close" onclick="GalleryJs.close()"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button type="button" class="gl-lbn gl-lbp" aria-label="Previous photo" onclick="GalleryJs.step(-1)"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <figure class="gl-lbf"><img id="gl-lbimg" src="images/hero-thumb.webp" alt=""><figcaption id="gl-lbcap"></figcaption></figure>
    <button type="button" class="gl-lbn gl-lbnx" aria-label="Next photo" onclick="GalleryJs.step(1)"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="gl-toast" id="gl-toast" role="status" aria-live="polite"></div>
</div>
