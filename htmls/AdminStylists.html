<div class="sy-site" data-page="AdminStylists" id="sy-site-root">
<header class="sy-top">
    <button type="button" class="sy-burger" aria-label="Menu" onclick="AdminStylistsJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="sy-logo" href="Admin"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#231A17"/><path d="M14 31c-1-7 13-7 13-14 0-4-3-7-7.5-7" fill="none" stroke="#E8C9A9" stroke-width="3.2" stroke-linecap="round"/><path d="M20 32c0-5 9-5.5 9.5-11" fill="none" stroke="#C2553A" stroke-width="2.6" stroke-linecap="round"/></svg><span id="sy-brand">Staff</span><small>Staff</small></a>
    <div class="sy-who" id="sy-who"></div>
    <a class="sy-tl sy-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="sy-tl" onclick="AdminStylistsJs.signout()">Sign out</button>
</header>
<div class="sy-body">
    <nav class="sy-rail" id="sy-rail" aria-label="Staff menu">
        <div class="sy-rail-top"><b>Menu</b><button type="button" class="sy-ibtn" aria-label="Close menu" onclick="AdminStylistsJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="sy-menu" id="sy-menu"></div>
    </nav>
    <div class="sy-scrim" id="sy-scrim" onclick="AdminStylistsJs.closeMenu()"></div>
    <main class="sy-main" id="sy-main"><div class="sy-loading">Loading</div></main>
</div>
<div class="sy-modal" id="sy-modal" aria-hidden="true">
    <div class="sy-mbox" role="dialog" aria-modal="true" aria-labelledby="sy-mtitle">
        <div class="sy-mhead"><h2 id="sy-mtitle"></h2><button type="button" class="sy-ibtn" aria-label="Close" onclick="AdminStylistsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="sy-mbody" id="sy-mbody"></div>
    </div>
</div>
<div class="sy-pk" id="sy-pk" aria-hidden="true">
    <div class="sy-mbox sy-pkbox" role="dialog" aria-modal="true" aria-labelledby="sy-pkt">
        <div class="sy-mhead"><h2 id="sy-pkt">Choose a photo</h2><button type="button" class="sy-ibtn" aria-label="Close" onclick="AdminStylistsJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="sy-mbody">
            <div class="sy-pkbar"><input type="search" id="sy-pkq" placeholder="Search photos" maxlength="40" oninput="AdminStylistsJs.pkSearch()" aria-label="Search photos"><label class="sy-btn sy-btn-ghost sy-btn-sm sy-upbtn"><input type="file" id="sy-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminStylistsJs.pkUpload()">Upload new</label></div>
            <p class="sy-upmsg" id="sy-pkmsg" role="status"></p>
            <div class="sy-pkgrid" id="sy-pkgrid"></div>
        </div>
    </div>
</div>
<div class="sy-toast" id="sy-toast" role="status" aria-live="polite"></div>
</div>
